<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>casdey reel</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { width: 360px; height: 640px; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ============================================================
   casdey Instagram reels, 1080x1920. Driven by
   scripts/instagram-render.mjs, which injects the fonts and the
   mp4-muxer build, then calls window.renderReel(spec).

   Two kinds (content-plan.md, "Formats"):
     pov   a relatable line over a stock clip, made to look like
           a post from a phone: plain white text, no brand mark,
           no grade. Modelled on Glofox's and PushPress's
           relatable reels, which beat their accounts' averages.
     demo  casdey's loop drawn as its own UI, for the one ask post
           a week.

   Music is a real track from content/instagram/music/ (Meta Sound
   Collection or Pixabay, see the batch's `music` field), mixed in
   here. With no track the reel is silent. Every frame is drawn,
   then encoded with its own timestamp, so a slow frame can never
   come out late.
   ============================================================ */
const W = 1080, H = 1920, FPS = 30;
const C = {
  paper: '#F7F7F4', panel: '#FFFFFF', sunk: '#EFEEE8', ink: '#17160F', graphite: '#4E4A3F',
  stone: '#8A8375', line: '#E3E0D6', gold: '#8F6A10', leaf: '#D4AF37', leafSoft: '#F4EACD',
  good: '#3F7D4F', goodSoft: '#E3EFE5', danger: '#A23B32', dangerSoft: '#F6E3E0',
};
const AV = ['#E9D9A6', '#CFE0DC', '#E8D5CF', '#D9DCEB', '#E6E0C9', '#D4E6D6'];

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, s, d) => clamp((t - s) / d);
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  out: x => 1 - Math.pow(1 - x, 3),
  inOut: x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  back: x => { const c1 = 1.5, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
/* 0 outside [a, b], eased in over fi and out over fo inside it. */
const win = (t, a, b, fi = 0.5, fo = 0.5) =>
  t < a || t > b ? 0 : Math.min(E.out(p(t, a, fi)), 1 - E.inOut(p(t, b - fo, fo)));

// Injected faces: Outfit 600/700, IBM Plex Sans 400/500, IBM Plex Mono 500, Inter 600/700.
function fnt(size, weight = 600, family = 'Outfit') { return `${weight} ${size}px "${family}"`; }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function txt(ctx, s, x, y, o = {}) {
  ctx.save();
  ctx.font = fnt(o.size || 32, o.weight || 600, o.family || 'Outfit');
  ctx.fillStyle = o.color || C.ink;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.globalAlpha *= o.alpha == null ? 1 : o.alpha;
  ctx.fillText(s, x, y);
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}

/* Word-wraps plain text to a width, in the context's current font. */
function wrap(ctx, text, maxW) {
  const lines = [];
  let line = '';
  for (const word of text.split(/\s+/).filter(Boolean)) {
    const next = line ? `${line} ${word}` : word;
    if (line && ctx.measureText(next).width > maxW) { lines.push(line); line = word; } else line = next;
  }
  if (line) lines.push(line);
  return lines;
}

function shadowCard(ctx, x, y, w, h, r, fill = C.panel, blur = 50, oy = 18, alpha = 0.12) {
  ctx.save();
  ctx.shadowColor = `rgba(23,22,15,${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = oy;
  ctx.fillStyle = fill;
  rr(ctx, x, y, w, h, r); ctx.fill();
  ctx.restore();
}

function pill(ctx, s, x, y, o = {}) {
  const size = o.size || 26;
  ctx.save();
  ctx.font = fnt(size, 500, o.family || 'IBM Plex Sans');
  const w = ctx.measureText(s).width + (o.dot ? 30 : 0);
  const px = o.px || 20, h = size * 1.8;
  const bx = o.align === 'right' ? x - w - px * 2 : o.align === 'center' ? x - (w + px * 2) / 2 : x;
  ctx.fillStyle = o.bg || C.sunk;
  rr(ctx, bx, y, w + px * 2, h, h / 2); ctx.fill();
  if (o.dot) { ctx.fillStyle = o.color; ctx.beginPath(); ctx.arc(bx + px + 8, y + h / 2, 7, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = o.color || C.graphite;
  ctx.textBaseline = 'middle';
  ctx.fillText(s, bx + px + (o.dot ? 30 : 0), y + h / 2 + 1);
  ctx.restore();
  return w + px * 2;
}

function avatar(ctx, cx, cy, r, name, idx, grey = 0) {
  ctx.save();
  ctx.fillStyle = grey > 0.5 ? '#DEDBD2' : AV[idx % AV.length];
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  txt(ctx, name[0], cx, cy + r * 0.36, { size: r, weight: 700, align: 'center', color: grey > 0.5 ? C.stone : C.ink });
  ctx.restore();
}

function check(ctx, cx, cy, r, color, prog = 1) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pts = [[-0.45, 0.02], [-0.12, 0.34], [0.5, -0.32]];
  const seg1 = clamp(prog * 2), seg2 = clamp(prog * 2 - 1);
  ctx.beginPath();
  ctx.moveTo(cx + pts[0][0] * r, cy + pts[0][1] * r);
  ctx.lineTo(cx + lerp(pts[0][0], pts[1][0], seg1) * r, cy + lerp(pts[0][1], pts[1][1], seg1) * r);
  if (seg2 > 0) ctx.lineTo(cx + lerp(pts[1][0], pts[2][0], seg2) * r, cy + lerp(pts[1][1], pts[2][1], seg2) * r);
  ctx.stroke();
  ctx.restore();
}

/* A fingertip, not an arrow: on a phone-shaped video an arrow cursor reads as desktop. */
function tap(ctx, x, y, pressed = 0, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.fillStyle = 'rgba(23,22,15,0.28)';
  ctx.beginPath(); ctx.arc(x, y, 34 - pressed * 8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4;
  ctx.stroke();
  ctx.restore();
}

function ripple(ctx, x, y, t, at, color = C.leaf) {
  const k = p(t, at, 0.6);
  if (k <= 0 || k >= 1) return;
  ctx.save();
  ctx.globalAlpha *= (1 - k) * 0.5;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, 16 + E.out(k) * 90, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* The casdey mark: four rounded bars pinwheeled round an open centre, the top one Leaf. */
function mark(ctx, cx, cy, size, prog = 1, bars = C.ink) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(size / 100, size / 100);
  for (let k = 0; k < 4; k++) {
    const a = E.back(clamp(prog * 1.25 - k * 0.08));
    if (a <= 0) continue;
    ctx.save();
    ctx.globalAlpha *= clamp(a * 1.5);
    ctx.rotate(k * Math.PI / 2 + (1 - a) * 1.2);
    const out = (1 - a) * 60;
    ctx.translate(-out, -out);
    ctx.fillStyle = k === 0 ? C.leaf : bars;
    rr(ctx, -38, -38, 44, 22, 11); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ============================ POV ============================
   Text the way Instagram's own editor sets it: white, centred,
   a thin dark edge so it reads on any footage, no box, no brand
   colour. Each block appears at its time and stays. Text keeps
   clear of the top bar and of the caption, buttons and username
   that cover the bottom of a reel.
   ============================================================ */
const SAFE = { top: 250, bottom: 1400 };
const TEXT_WIDTH = 860;

function layoutBlock(ctx, block) {
  const size = block.size || 60;
  ctx.save();
  ctx.font = fnt(size, 600, 'Inter');
  const lines = wrap(ctx, block.text, TEXT_WIDTH);
  ctx.restore();
  return { size, lines, height: lines.length * size * 1.24 };
}

function drawBlock(ctx, block, lay, top, t) {
  if (t < block.from) return;
  ctx.save();
  ctx.font = fnt(lay.size, 600, 'Inter');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  // "label": Instagram's boxed text style, for footage too bright for plain white.
  if (block.style === 'label') {
    lay.lines.forEach((line, i) => {
      const w = ctx.measureText(line).width;
      const rowTop = top + i * lay.size * 1.24;
      ctx.fillStyle = 'rgba(0,0,0,0.72)';
      rr(ctx, W / 2 - w / 2 - lay.size * 0.35, rowTop - lay.size * 0.08, w + lay.size * 0.7, lay.size * 1.3, lay.size * 0.28); ctx.fill();
    });
    lay.lines.forEach((line, i) => {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(line, W / 2, top + (i + 0.82) * lay.size * 1.24);
    });
    ctx.restore();
    return;
  }
  lay.lines.forEach((line, i) => {
    const y = top + (i + 0.82) * lay.size * 1.24;
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = lay.size * 0.12;
    ctx.strokeText(line, W / 2, y);
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(line, W / 2, y);
    ctx.shadowBlur = 0;
  });
  ctx.restore();
}

function coverImage(ctx, source, sw, sh) {
  const scale = Math.max(W / sw, H / sh);
  const dw = sw * scale, dh = sh * scale;
  ctx.drawImage(source, (W - dw) / 2, (H - dh) / 2, dw, dh);
}

function seek(video, time) {
  return new Promise((resolve) => {
    if (Math.abs(video.currentTime - time) < 0.001 && video.readyState >= 2) return resolve();
    const done = () => { video.removeEventListener('seeked', done); resolve(); };
    video.addEventListener('seeked', done);
    video.currentTime = time;
  });
}

function povLayout(ctx, spec) {
  const lays = spec.texts.map((block) => layoutBlock(ctx, block));
  const tops = [];
  let y = spec.textTop || 520;
  lays.forEach((lay, i) => { tops.push(spec.texts[i].top ?? y); y = (spec.texts[i].top ?? y) + lay.height + 36; });
  return { lays, tops };
}

async function drawPov(ctx, spec, video, t, layout) {
  // Ping-pong through the clip so a reel longer than its clip never jumps.
  const start = spec.clipStart || 0;
  const len = Math.max(0.5, video.duration - start - 0.05);
  let u = (t * (spec.clipRate || 1)) % (2 * len);
  if (u > len) u = 2 * len - u;
  await seek(video, start + u);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  coverImage(ctx, video, video.videoWidth, video.videoHeight);
  spec.texts.forEach((block, i) => drawBlock(ctx, block, layout.lays[i], layout.tops[i], t));
}

/* ============================ DEMO ===========================
   casdey's loop in three steps, drawn as its own UI. The gym and
   its members are an example and the reel says so on screen.
   ============================================================ */
function paper(ctx, t) {
  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, W, H);
  const gx = 540 + Math.sin(t * 0.3) * 300, gy = 800 + Math.cos(t * 0.22) * 260;
  const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 900);
  g.addColorStop(0, 'rgba(212,175,55,0.16)'); g.addColorStop(1, 'rgba(212,175,55,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(23,22,15,0.07)';
  const off = (t * 8) % 54;
  for (let y = -54 + off; y < H + 54; y += 54)
    for (let x = 27; x < W; x += 54) { ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill(); }
}

function headline(ctx, text, y, size, t, start) {
  ctx.save();
  ctx.font = fnt(size, 700);
  ctx.letterSpacing = `${-size * 0.025}px`;
  const lines = wrap(ctx, text, 900);
  const space = ctx.measureText(' ').width;
  let n = 0;
  lines.forEach((line, li) => {
    const words = line.split(' ');
    const widths = words.map((w) => ctx.measureText(w).width);
    let x = W / 2 - (widths.reduce((a, b) => a + b, 0) + space * (words.length - 1)) / 2;
    words.forEach((w, i) => {
      const a = E.out(p(t, start + n++ * 0.06, 0.55));
      if (a > 0) {
        ctx.save();
        ctx.globalAlpha *= a;
        ctx.fillStyle = C.ink;
        ctx.fillText(w, x, y + li * size * 1.08 + (1 - a) * size * 0.4);
        ctx.restore();
      }
      x += widths[i] + space;
    });
  });
  ctx.restore();
}

function stepCaption(ctx, n, text, t, a0, a1) {
  const a = win(t, a0, a1, 0.45, 0.35);
  if (!a) return;
  ctx.save();
  ctx.globalAlpha *= a;
  const y = 1395 + (1 - E.out(p(t, a0, 0.45))) * 20;
  ctx.font = fnt(48, 600);
  const w = ctx.measureText(text).width;
  const x = W / 2 - (w + 84) / 2;
  ctx.fillStyle = C.leaf;
  ctx.beginPath(); ctx.arc(x + 30, y - 16, 30, 0, Math.PI * 2); ctx.fill();
  txt(ctx, String(n), x + 30, y - 1, { size: 38, weight: 700, align: 'center', color: C.ink });
  txt(ctx, text, x + 84, y, { size: 48, weight: 600, color: C.ink });
  ctx.restore();
}

function membersScene(ctx, spec, t) {
  const a = win(t, 1.0, 6.4, 0.5, 0.4);
  if (!a) return;
  const names = spec.members;
  const lapsed = new Set(spec.lapsed);
  ctx.save();
  ctx.globalAlpha *= a;
  const x = 90, y = 520 + (1 - E.out(p(t, 1.0, 0.6))) * 60, w = 900, h = 780;
  shadowCard(ctx, x, y, w, h, 40);
  txt(ctx, 'Members', x + 50, y + 92, { size: 50, weight: 700 });
  const countIn = E.out(p(t, 4.6, 0.4));
  if (countIn > 0) {
    ctx.save(); ctx.globalAlpha *= countIn;
    pill(ctx, `${lapsed.size} lapsed`, x + w - 50, y + 50, { size: 28, bg: C.dangerSoft, color: C.danger, align: 'right' });
    ctx.restore();
  }
  names.forEach((name, i) => {
    const rowIn = E.out(p(t, 1.3 + i * 0.12, 0.5));
    if (!rowIn) return;
    const ry = y + 150 + i * 102 + (1 - rowIn) * 30;
    const l = lapsed.has(i) ? E.out(p(t, 3.0 + [...lapsed].indexOf(i) * 0.3, 0.45)) : 0;
    ctx.save();
    ctx.globalAlpha *= rowIn;
    if (i > 0) { ctx.fillStyle = C.line; ctx.fillRect(x + 50, ry - 12, w - 100, 2); }
    avatar(ctx, x + 88, ry + 42, 34, name, i, l);
    txt(ctx, name, x + 142, ry + 36, { size: 36, weight: 500, family: 'IBM Plex Sans', color: l > 0.5 ? C.stone : C.ink });
    if (l < 0.5) txt(ctx, 'In 3 days ago', x + 142, ry + 76, { size: 26, weight: 400, family: 'IBM Plex Sans', color: C.stone });
    else txt(ctx, 'Last in 64 days ago', x + 142, ry + 76, { size: 26, weight: 400, family: 'IBM Plex Sans', color: C.danger, alpha: (l - 0.5) * 2 });
    if (l > 0) {
      ctx.save(); ctx.globalAlpha *= l;
      pill(ctx, 'Lapsed', x + w - 50, ry + 20, { size: 26, bg: C.dangerSoft, color: C.danger, align: 'right' });
      ctx.restore();
    }
    ctx.restore();
  });
  ctx.restore();
}

function messageScene(ctx, spec, t) {
  const a = win(t, 6.3, 11.5, 0.5, 0.4);
  if (!a) return;
  ctx.save();
  ctx.globalAlpha *= a;
  const x = 90, y = 520 + (1 - E.out(p(t, 6.3, 0.6))) * 60, w = 900, h = 780;
  shadowCard(ctx, x, y, w, h, 40);
  ctx.fillStyle = C.leaf;
  ctx.beginPath(); ctx.arc(x + 88, y + 90, 40, 0, Math.PI * 2); ctx.fill();
  txt(ctx, spec.gym[0], x + 88, y + 105, { size: 42, weight: 700, align: 'center' });
  txt(ctx, spec.gym, x + 150, y + 82, { size: 38, weight: 600 });
  txt(ctx, `to ${spec.members[spec.lapsed[0]]}`, x + 150, y + 124, { size: 28, weight: 400, family: 'IBM Plex Sans', color: C.stone });
  ctx.fillStyle = C.line; ctx.fillRect(x + 50, y + 170, w - 100, 2);

  // The message types itself out, then the send.
  const full = spec.message;
  const shown = full.slice(0, Math.round(full.length * p(t, 6.9, 2.6)));
  ctx.save();
  ctx.font = fnt(36, 400, 'IBM Plex Sans');
  let ly = y + 240;
  shown.split('\n').forEach((para) => {
    wrap(ctx, para, w - 110).forEach((line) => {
      ctx.fillStyle = /^casdey\.com/.test(line) ? C.gold : C.ink;
      ctx.fillText(line, x + 55, ly);
      ly += 54;
    });
    ly += 18;
  });
  ctx.restore();

  const bx = x + w - 55 - 220, by = y + h - 130;
  const sent = p(t, 10.35, 0.3);
  ctx.fillStyle = sent > 0 ? C.good : C.ink;
  rr(ctx, bx, by, 220, 84, 42); ctx.fill();
  txt(ctx, sent > 0 ? 'Sent' : 'Send', bx + 110, by + 55, { size: 36, weight: 600, align: 'center', color: '#FFFFFF' });
  ripple(ctx, bx + 110, by + 42, t, 10.35, C.leaf);
  const ok = E.out(p(t, 10.5, 0.4));
  if (ok > 0) {
    ctx.save(); ctx.globalAlpha *= ok;
    pill(ctx, `Sent as ${spec.gym}`, x + 55, by + 12, { size: 28, bg: C.goodSoft, color: C.good, dot: true });
    ctx.restore();
  }
  const travel = E.inOut(p(t, 9.7, 0.6));
  tap(ctx, lerp(700, bx + 110, travel), lerp(1500, by + 42, travel), p(t, 10.3, 0.1) * (1 - p(t, 10.5, 0.15)), win(t, 9.6, 10.9, 0.2, 0.3));
  ctx.restore();
}

function bookingScene(ctx, spec, t) {
  const a = win(t, 11.4, 15.3, 0.5, 0.4);
  if (!a) return;
  ctx.save();
  ctx.globalAlpha *= a;
  const x = 90, y = 520 + (1 - E.out(p(t, 11.4, 0.6))) * 60, w = 900, h = 780;
  shadowCard(ctx, x, y, w, h, 40);
  txt(ctx, 'Pick a time', x + 55, y + 100, { size: 52, weight: 700 });
  txt(ctx, spec.gym, x + 55, y + 148, { size: 30, weight: 400, family: 'IBM Plex Sans', color: C.stone });
  ['Mon 21', 'Tue 22', 'Wed 23'].forEach((d, i) => {
    const dx = x + 55 + i * 275;
    ctx.fillStyle = i === 1 ? C.ink : C.sunk;
    rr(ctx, dx, y + 200, 250, 90, 24); ctx.fill();
    txt(ctx, d, dx + 125, y + 258, { size: 34, weight: 600, align: 'center', color: i === 1 ? '#FFFFFF' : C.graphite });
  });
  const picked = p(t, 12.9, 0.25);
  ['06:00', '07:00', '12:30', '18:00'].forEach((s, i) => {
    const sx = x + 55 + (i % 2) * 405, sy = y + 330 + Math.floor(i / 2) * 130;
    const on = i === 1 && picked > 0;
    ctx.fillStyle = on ? C.leaf : C.panel;
    rr(ctx, sx, sy, 385, 106, 26); ctx.fill();
    ctx.strokeStyle = on ? C.leaf : C.line; ctx.lineWidth = 3;
    rr(ctx, sx, sy, 385, 106, 26); ctx.stroke();
    txt(ctx, s, sx + 192, sy + 68, { size: 42, weight: 600, align: 'center', color: C.ink });
  });
  ripple(ctx, x + 55 + 405 + 192, y + 330 + 53, t, 12.9);
  const travel = E.inOut(p(t, 12.2, 0.6));
  tap(ctx, lerp(560, x + 55 + 405 + 192, travel), lerp(1500, y + 330 + 53, travel), p(t, 12.85, 0.1) * (1 - p(t, 13.05, 0.15)), win(t, 12.1, 13.4, 0.2, 0.3));

  const done = E.out(p(t, 13.5, 0.5));
  if (done > 0) {
    ctx.save(); ctx.globalAlpha *= done;
    const cy = y + 650;
    ctx.fillStyle = C.goodSoft;
    ctx.beginPath(); ctx.arc(x + 100, cy, 46, 0, Math.PI * 2); ctx.fill();
    check(ctx, x + 100, cy, 46, C.good, p(t, 13.55, 0.4));
    txt(ctx, 'Booked, Tue 22 at 07:00', x + 170, cy - 6, { size: 40, weight: 700 });
    txt(ctx, 'Added to the gym\'s Google Calendar', x + 170, cy + 42, { size: 28, weight: 400, family: 'IBM Plex Sans', color: C.graphite });
    ctx.restore();
  }
  ctx.restore();
}

function endCard(ctx, spec, t) {
  const a = E.out(p(t, 15.2, 0.5));
  if (!a) return;
  ctx.save();
  ctx.globalAlpha *= a;
  mark(ctx, W / 2, 740, 190, p(t, 15.3, 0.9));
  txt(ctx, 'casdey', W / 2, 1000, { size: 120, weight: 700, align: 'center', ls: -3 });
  txt(ctx, spec.endLine, W / 2, 1100, { size: 50, weight: 600, align: 'center', color: C.graphite });
  const ctaIn = E.out(p(t, 15.9, 0.5));
  if (ctaIn > 0) {
    ctx.save(); ctx.globalAlpha *= ctaIn;
    ctx.font = fnt(46, 700);
    const cw = ctx.measureText(spec.endCta).width + 90;
    ctx.fillStyle = C.leaf;
    rr(ctx, W / 2 - cw / 2, 1190, cw, 110, 55); ctx.fill();
    txt(ctx, spec.endCta, W / 2, 1261, { size: 46, weight: 700, align: 'center' });
    ctx.restore();
  }
  ctx.restore();
}

function drawDemo(ctx, spec, t) {
  paper(ctx, t);
  const body = 1 - E.inOut(p(t, 15.0, 0.4));
  if (body > 0) {
    ctx.save();
    ctx.globalAlpha *= body;
    pill(ctx, spec.tag, W / 2, 200, { size: 24, family: 'IBM Plex Mono', bg: C.leafSoft, color: C.gold, align: 'center' });
    headline(ctx, spec.headline, 380, 76, t, 0.2);
    membersScene(ctx, spec, t);
    messageScene(ctx, spec, t);
    bookingScene(ctx, spec, t);
    stepCaption(ctx, 1, spec.steps[0], t, 1.4, 6.3);
    stepCaption(ctx, 2, spec.steps[1], t, 6.5, 11.4);
    stepCaption(ctx, 3, spec.steps[2], t, 11.6, 15.1);
    ctx.restore();
  }
  endCard(ctx, spec, t);
  const fin = 1 - p(t, 0, 0.3);
  if (fin > 0) { ctx.fillStyle = `rgba(247,247,244,${fin})`; ctx.fillRect(0, 0, W, H); }
}

/* ============================ MUSIC ============================
   A licensed track, cut to the reel from `musicStart`, with a short
   fade at each end so it never starts or stops on a hard edge. */
async function mixTrack(spec) {
  if (!spec.music) return null;
  const sr = 44100;
  const bytes = Uint8Array.from(atob(await window.__asset('music', spec.music)), (c) => c.charCodeAt(0));
  const ac = new OfflineAudioContext(2, Math.ceil(sr * spec.duration), sr);
  const buffer = await ac.decodeAudioData(bytes.buffer);
  const start = spec.musicStart || 0;
  if (start + spec.duration > buffer.duration + 0.01) {
    throw new Error(`${spec.music} is ${buffer.duration.toFixed(1)}s, too short to play ${spec.duration}s from ${start}s`);
  }
  const src = ac.createBufferSource();
  src.buffer = buffer;
  const gain = ac.createGain();
  const level = spec.musicGain ?? 0.9;
  gain.gain.setValueAtTime(0, 0);
  gain.gain.linearRampToValueAtTime(level, 0.15);
  gain.gain.setValueAtTime(level, Math.max(0.2, spec.duration - 0.8));
  gain.gain.linearRampToValueAtTime(0, spec.duration);
  src.connect(gain); gain.connect(ac.destination);
  src.start(0, start, spec.duration);
  return ac.startRendering();
}

/* ============================ RENDER ============================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function b64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}

async function loadClip(name) {
  const bytes = Uint8Array.from(atob(await window.__asset('footage', name)), (c) => c.charCodeAt(0));
  const video = document.createElement('video');
  video.muted = true;
  video.preload = 'auto';
  video.src = URL.createObjectURL(new Blob([bytes], { type: 'video/mp4' }));
  await new Promise((resolve, reject) => {
    video.onloadeddata = resolve;
    video.onerror = () => reject(new Error(`clip ${name} could not be decoded`));
  });
  return video;
}

window.renderReel = async (spec, bitrate = 9_000_000) => {
  await Promise.all(['700 80px "Outfit"', '600 80px "Outfit"', '400 30px "IBM Plex Sans"', '500 30px "IBM Plex Sans"', '500 30px "IBM Plex Mono"', '600 60px "Inter"'].map((f) => document.fonts.load(f)));
  const problems = [];
  let video = null, draw;
  if (spec.kind === 'pov') {
    video = await loadClip(spec.clip);
    const layout = povLayout(ctx, spec);
    layout.lays.forEach((lay, i) => {
      if (layout.tops[i] < SAFE.top) problems.push(`text ${i + 1} starts above the safe area`);
      if (layout.tops[i] + lay.height > SAFE.bottom) problems.push(`text ${i + 1} runs into the bottom of the reel, where Instagram's caption sits`);
    });
    draw = (t) => drawPov(ctx, spec, video, t, layout);
  } else if (spec.kind === 'demo') {
    draw = async (t) => drawDemo(ctx, spec, t);
  } else {
    throw new Error(`unknown reel kind: ${spec.kind}`);
  }

  await draw(spec.cover ?? 1);
  const cover = canvas.toDataURL('image/jpeg', 0.92);

  const duration = spec.duration;
  const audio = await mixTrack(spec);
  const { Muxer, ArrayBufferTarget } = Mp4Muxer;
  const muxer = new Muxer({
    target: new ArrayBufferTarget(),
    video: { codec: 'avc', width: W, height: H, frameRate: FPS },
    ...(audio ? { audio: { codec: 'aac', numberOfChannels: 2, sampleRate: 44100 } } : {}),
    fastStart: 'in-memory',
  });
  let failure = null;
  const ve = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => (failure = e) });
  ve.configure({ codec: 'avc1.640028', width: W, height: H, bitrate, bitrateMode: 'constant', framerate: FPS, avc: { format: 'avc' } });

  const total = Math.round(duration * FPS);
  const frameUs = 1e6 / FPS;
  for (let i = 0; i < total; i++) {
    await draw(i / FPS);
    const frame = new VideoFrame(canvas, { timestamp: Math.round(i * frameUs), duration: Math.round(frameUs) });
    ve.encode(frame, { keyFrame: i % (FPS * 2) === 0 });
    frame.close();
    while (ve.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 2));
    if (failure) throw failure;
  }
  await ve.flush();

  if (audio) {
    const ae = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: (e) => (failure = e) });
    ae.configure({ codec: 'mp4a.40.2', sampleRate: 44100, numberOfChannels: 2, bitrate: 160000 });
    const L = audio.getChannelData(0), R = audio.getChannelData(1), step = 4410;
    for (let s = 0; s < L.length; s += step) {
      const n = Math.min(step, L.length - s);
      const data = new Float32Array(n * 2);
      data.set(L.subarray(s, s + n), 0);
      data.set(R.subarray(s, s + n), n);
      const ad = new AudioData({ format: 'f32-planar', sampleRate: 44100, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round((s * 1e6) / 44100), data });
      ae.encode(ad);
      ad.close();
    }
    await ae.flush();
  }
  if (failure) throw failure;
  muxer.finalize();
  const bytes = new Uint8Array(muxer.target.buffer);
  for (let i = 0; i < bytes.length; i += 4_000_000) await window.__chunk(b64(bytes.subarray(i, i + 4_000_000)));
  if (video) URL.revokeObjectURL(video.src);
  return { frames: total, bytes: bytes.length, cover, problems, audio: Boolean(audio) };
};
